<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ENDTERM EXAM-KIT — BA + MAD2 + MLP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

</head>
<body>
  <div id="app">Loading your exam kit…</div>

    window.$docsify = {
      name: 'ENDTERM EXAM-KIT',

  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
